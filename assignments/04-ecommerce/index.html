<html>
    <head>
    <title> Record Store! </title>

    </head>

    <body>

        <div id="top">

            <form id="newCatalogItemForm">
                <input name="recordName" id="recordNameInput" type="text" placeholder="Add product name" required>
                <input name="artist" id="artistInput" type="text" placeholder="Add artist" required>
                <input name="genre" id="genreInput" type="text" placeholder="Add genre" required>
                <input name="price" id="priceInput" type="number" placeholder="Add price" required>
                <input name="albumPhoto" id="artistInput" type="text" placeholder="Add an album photo link" required>
                <input name="description" id="descriptionInput" type="text" placeholder="Add a description" required>

                <input type="submit">
            </form>
            
            <div id="root"> </div>
            <div id="cart"> </div>

        </div>

        

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer> </script>
    </body>



</html>
